<!--
 LIFE SIMULATOR X / PROJECT NOTES
 --------------------------------
 Architecture:
  01. Core state is stored in localStorage.
  02. The yearly loop is deliberately action-limited.
  03. Jobs are requirement-driven rather than click-driven.
  04. The expansion layer adds economy, banking, market, items, education,
      entrepreneurship and an activity timeline.
  05. Telegram WebApp detection is optional: the game remains playable in a browser.
  06. All systems are designed so a backend can later replace localStorage
      without changing the UI contract.

 Design goals:
  - Mobile-first
  - No mandatory account
  - Fast initial load
  - Offline-friendly core gameplay
  - Deterministic state serialization
  - Expandable content database
-->

 money:0,lifetime:0,age:0,actions:15,energy:20,maxEnergy:20,
 health:80,intelligence:20,education:0,creativity:20,social:20,discipline:20,
 happiness:75,reputation:0,relationship:0,job:null,jobLevel:0,jobXP:0,
 vehicle:0,home:0,married:false,children:0,expenses:0,passive:0,
 prestige:0,lastDaily:0,ach:{},currentEvent:null,lastSeen:Date.now()
};
function save(){try{S.lastSeen=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)S=Object.assign(S,x)}catch(e){}}
function stage(){let r=stages[0];for(const x of stages)if(S.age>=x[0])r=x;return r}
function jobData(){return jobs.find(j=>j[0]===S.job)}
function skill(k){return S[k]||0}
function currentIncome(){const j=jobData();return j?j[4]+S.jobLevel*350:0}
function currentExpenses(){return Math.round(20+S.age*8+(assets.vehicle[S.vehicle][3]*.25)+(assets.home[S.home][3]*.35)+(S.children*45)+(S.married?70:0))}
function doAction(type){
 if(S.actions<=0){toast('⚡ اقدامات امسال تمام شده؛ سال را تمام کن');return}
 S.actions--;
 if(type==='study'){S.intelligence+=4;S.education+=5;S.discipline+=2;S.happiness-=1}
 if(type==='sport'){S.health=clamp(S.health+5,0,100);S.discipline+=2;S.happiness+=2}
 if(type==='social'){S.social+=5;S.relationship+=3;S.happiness+=4}
 if(type==='create'){S.creativity+=5;S.reputation+=1;S.happiness+=3}
 if(type==='work'){if(S.age<15){toast('هنوز برای کار زود است');S.actions++;return}const j=jobData();if(!j){toast('اول یک شغل انتخاب کن');S.actions++;openView('jobs');return}let gain=currentIncome();S.money+=gain;S.lifetime+=gain;S.jobXP+=j[8];S.happiness-=1}
 if(type==='rest'){S.energy=Math.min(S.maxEnergy,S.energy+6);S.health=clamp(S.health+2,0,100);S.happiness+=5}
 S.intelligence=clamp(S.intelligence,0,100);S.health=clamp(S.health,0,100);S.creativity=clamp(S.creativity,0,100);S.social=clamp(S.social,0,100);S.discipline=clamp(S.discipline,0,100);S.happiness=clamp(S.happiness,0,100);
 render()
}
function finishYear(){
 if(S.age>=100){toast('زندگی به پایان رسیده است');return}
 const income=currentIncome()*Math.max(1,Math.floor(S.actions===15?0:1));
 S.money+=income;S.lifetime+=income;
 const exp=currentExpenses();S.money-=Math.min(S.money,exp);S.expenses+=exp;
 S.energy=S.maxEnergy;S.actions=MAX_ACTIONS;S.age++;
 S.health-=S.age>55?2:0;S.happiness+=S.married?1:-1;
 S.jobXP+=jobData()?10:0;
 if(S.currentEvent)S.currentEvent=null;
 if(Math.random()<.55 && S.age>=15)triggerEvent();
 checkAchievements();toast('🌅 سال جدید شروع شد — سن '+S.age);render()
}
function triggerEvent(){
 const possible=events.filter(e=>S.age>=e[0]&&S.age<=e[1]);
 if(!possible.length)return;
 const e=possible[Math.floor(Math.random()*possible.length)];
 S.currentEvent=e;openView('events');
}
function resolveEvent(choice){
 const e=S.currentEvent;if(!e)return;
 let msg='';
 switch(e[2]){
 case'🎒':if(choice===0){S.social+=8;S.happiness+=5;msg='یک دوست صمیمی پیدا کردی'}else{S.intelligence+=8;S.education+=8;msg='درست را انتخاب کردی'}break;
 case'🏫':if(choice===0){S.happiness+=8;S.creativity+=8;msg='مسیر مورد علاقه‌ات را انتخاب کردی'}else{S.intelligence+=5;S.discipline+=7;msg='مسیر پردرآمدتر را انتخاب کردی'}break;
 case'💼':if(choice===0){S.jobXP+=80;S.reputation+=5;msg='تجربه کاری گرفتی'}else{S.happiness+=4;msg='فعلاً آزاد ماندی'}break;
 case'❤️':if(choice===0){S.relationship+=20;S.happiness+=8;msg='رابطه جدی‌تر شد'}else{S.discipline+=3;msg='فعلاً صبر کردی'}break;
 case'🎓':if(choice===0){S.education+=20;S.intelligence+=10;S.money-=100;msg='سرمایه‌گذاری روی خودت جواب داد'}else{S.money+=400;S.lifetime+=400;msg='پول بیشتری به دست آوردی'}break;
 case'📈':if(choice===0){if(Math.random()<.58){S.money+=1500;S.lifetime+=1500;msg='سرمایه‌گذاری موفق شد'}else{S.money=Math.max(0,S.money-900);msg='سرمایه‌گذاری شکست خورد'}}else{S.money+=150;S.lifetime+=150;msg='سود کم اما مطمئن گرفتی'}break;
 case'🚗':if(choice===0){S.money=Math.max(0,S.money-1200);msg='ماشین را تعمیر کردی'}else{S.health-=5;msg='تعمیر را عقب انداختی'}break;
 case'💡':if(choice===0){S.reputation+=15;S.passive+=120;msg='کسب‌وکارت را شروع کردی'}else{S.money+=2500;S.lifetime+=2500;msg='ایده را فروختی'}break;
 case'✈️':if(choice===0){S.money+=500;S.social+=10;S.happiness+=5;msg='فصل جدیدی از زندگی شروع شد'}else{S.reputation+=5;msg='در کشور خودت ماندی'}break;
 case'❤️':if(choice===0){S.happiness+=15;S.relationship+=10;msg='خانواده را در اولویت گذاشتی'}else{S.money+=1000;S.lifetime+=1000;S.happiness-=10;msg='از نظر مالی جلو افتادی'}break;
 }
 S.currentEvent=null;toast('🎲 '+msg);render()
}
function selectJob(id){
 const j=jobs.find(x=>x[0]===id);if(!j||S.age<j[3])return;
 const req=j[5],attr=j[6],have=skill(attr==='هوش'?'intelligence':attr==='健康'?'health':attr==='سلامت'?'health':attr==='تحصیل'?'education':attr==='خلاقیت'?'creativity':attr==='رهبری'?'reputation':attr==='شهرت'?'reputation':attr==='اجتماعی'?'social':'discipline');
 if(have<req){toast('❌ شرایط این شغل را نداری');return}
 S.job=id;S.jobLevel=0;S.jobXP=0;S.reputation+=2;toast('💼 شغل جدید: '+j[2]);render()
}
function promote(){
 const j=jobData();if(!j||S.jobLevel>=4)return;
 const need=100+S.jobLevel*180;if(S.jobXP<need){toast('تجربه کافی نیست');return}
 S.jobLevel++;S.jobXP=0;S.happiness+=3;toast('📈 ترفیع گرفتی!');render()
}
function buyAsset(type){
 const arr=assets[type],idx=S[type]+1,n=arr[idx];if(!n)return;
 if(S.money<n[2]){toast('💰 پول کافی نیست');return}
 S.money-=n[2];S[type]=idx;toast('🎉 '+n[1]+' خریداری شد');render()
}
function marry(){if(S.age<18||S.married)return;if(S.money<500){toast('برای شروع زندگی مشترک حداقل ۵۰۰ پول لازم است');return}S.money-=500;S.married=true;S.relationship=100;toast('❤️ ازدواج کردی');render()}
function child(){if(!S.married||S.children>=4)return;if(S.money<300){toast('هزینه بزرگ کردن فرزند کم نیست');return}S.money-=300;S.children++;toast('👶 عضو جدید خانواده');render()}
function rest(){if(S.actions<=0)return;S.actions--;S.energy=Math.min(S.maxEnergy,S.energy+8);S.health=clamp(S.health+3,0,100);S.happiness=clamp(S.happiness+6,0,100);render()}
function daily(){
 const d=new Date();d.setHours(0,0,0,0);if(S.lastDaily>=d.getTime())return;
 S.lastDaily=d.getTime();const n=500+S.prestige*100;S.money+=n;S.lifetime+=n;toast('🎁 +'+fmt(n)+' جایزه روزانه');render()
}
function prestige(){
 if(S.age<75)return;
 if(!confirm('با شروع زندگی جدید، پول و سن و شغل پاک می‌شوند؛ Prestige و دستاوردها می‌مانند. ادامه؟'))return;
 S.prestige++;
 S={money:S.prestige*1000,lifetime:0,age:0,actions:15,energy:20,maxEnergy:20,health:80,intelligence:20,education:0,creativity:20,social:20,discipline:20,happiness:75,reputation:0,relationship:0,job:null,jobLevel:0,jobXP:0,vehicle:0,home:0,married:false,children:0,expenses:0,passive:S.prestige*25,prestige:S.prestige,lastDaily:S.lastDaily,ach:S.ach,currentEvent:null,lastSeen:Date.now()};
 toast('✨ زندگی تازه آغاز شد');render()
}
function checkAchievements(){for(const a of achievements)if(a[3](S)&&!S.ach[a[0]]){S.ach[a[0]]=1;toast('🏆 دستاورد: '+a[2])}}
function render(){
 document.getElementById('money').textContent=fmt(Math.max(0,S.money));document.getElementById('energy').textContent=fmt(S.energy)+'/'+fmt(S.maxEnergy);document.getElementById('age').textContent=fmt(S.age);
 const st=stage();document.getElementById('stage').textContent=st[2]+' '+st[1];document.getElementById('caption').textContent=st[1]+' — سال '+fmt(S.age);
 const scale=S.age<3?.45:S.age<7?.6:S.age<15?.8:S.age<60?1:.9;document.getElementById('person').style.transform='translateX(-50%) scale('+scale+')';
 document.getElementById('yearInfo').textContent='سن '+fmt(S.age);document.getElementById('actionsLeft').textContent=fmt(S.actions)+'/۱۵';document.getElementById('yearBar').style.width=((15-S.actions)/15*100)+'%';
 document.getElementById('endYear').disabled=S.age>=100;
 renderActions();renderStats();renderJobs();renderLife();renderEvents();renderMore();checkAchievements();save()
}
function renderActions(){
 const el=document.getElementById('actionGrid');
 const arr=[['study','📚','درس خواندن','هوش +۴ • تحصیل +۵'],['sport','🏃','ورزش','سلامت +۵ • انضباط +۲'],['social','👥','اجتماعی بودن','اجتماعی +۵ • شادی +۴'],['create','🎨','کار خلاقانه','خلاقیت +۵ • شهرت +۱']];
 if(S.age>=15)arr.push(['work','💼','کار کردن',S.job?('+'+fmt(currentIncome())+' درآمد'): 'اول شغل پیدا کن']);
 el.innerHTML=arr.map(x=>`<button class="btn" data-action="${x[0]}">${x[1]} ${x[2]}<br><span class="muted">${x[3]}</span></button>`).join('');
 el.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>doAction(b.dataset.action))
}
function renderStats(){
 const arr=[['❤️','سلامت','health'],['🧠','هوش','intelligence'],['🎓','تحصیلات','education'],['🎨','خلاقیت','creativity'],['👥','اجتماعی','social'],['😄','شادی','happiness'],['🧭','انضباط','discipline'],['⭐','شهرت','reputation']];
 document.getElementById('statsGrid').innerHTML=arr.map(x=>`<div class="card"><div class="name">${x[0]} ${x[1]}</div><div class="bar green" style="margin-top:6px"><i style="width:${clamp(S[x[2]],0,100)}%"></i></div><div class="desc">${fmt(S[x[2]])}/۱۰۰</div></div>`).join('')
}
function renderJobs(){
 const el=document.getElementById('jobsBody');document.getElementById('jobHint').textContent=S.age<15?'از ۱۵ سالگی':'۴۰ مسیر شغلی';
 if(S.age<15){el.innerHTML='<div class="lock">💼 از ۱۵ سالگی می‌توانی وارد بازار کار شوی.<br>تا آن زمان مهارت بساز و برای آینده آماده شو.</div>';return}
 const j=jobData();
 let html=j?`<div class="card"><div class="row"><div class="ico">${j[1]}</div><div class="info"><div class="name">${j[2]} • سطح ${S.jobLevel+1}</div><div class="desc">درآمد هر اقدام: ${fmt(currentIncome())} • XP: ${fmt(S.jobXP)}</div></div><button class="btn primary" id="promote" ${S.jobLevel>=4||S.jobXP<100+S.jobLevel*180?'disabled':''}>ترفیع</button></div></div><div class="desc" style="margin:10px 0">شغل فعلی را می‌توانی با انتخاب شغل جدید عوض کنی.</div>`:'<div class="lock">یک شغل متناسب با سن و مهارتت انتخاب کن.</div>';
 html+=`<div class="grid">${jobs.map(x=>{const attr=x[6],key=attr==='هوش'?'intelligence':attr==='تحصیل'?'education':attr==='خلاقیت'?'creativity':attr==='رهبری'?'reputation':attr==='شهرت'?'reputation':attr==='اجتماعی'?'social':attr==='سلامت'?'health':'discipline';const have=S[key];const ok=S.age>=x[3]&&have>=x[5];return `<div class="card row"><div class="ico">${x[1]}</div><div class="info"><div class="name">${x[2]}</div><div class="desc">سن ${x[3]}+ • ${attr} ${x[5]}+ • ${fmt(x[4])}/اقدام</div></div><button class="btn ${ok?'green':''}" data-job="${x[0]}" ${ok?'':'disabled'}>${S.job===x[0]?'انتخاب شده':'انتخاب'}</button></div>`}).join('')}</div>`;
 el.innerHTML=html;el.querySelector('#promote')?.addEventListener('click',promote);el.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>selectJob(b.dataset.job))
}
function renderLife(){
 let h=document.getElementById('lifeBody');
 h.innerHTML=`<div class="card row"><div class="ico">${S.married?'💑':'💍'}</div><div class="info"><div class="name">${S.married?'متأهل':'مجرد'}</div><div class="desc">${S.married?'فرزند: '+S.children+' • شادی و هزینه خانوادگی':'برای ازدواج باید ۱۸+ و حداقل ۵۰۰ پول داشته باشی.'}</div></div>${S.married?'':`<button class="btn primary" id="marry" ${S.age<18||S.money<500?'disabled':''}>ازدواج</button>`}</div>${S.married&&S.children<4?`<button class="btn green" id="child" style="width:100%;margin-top:8px">👶 بچه‌دار شدن — ۳۰۰</button>`:''}`;
 h.querySelector('#marry')?.addEventListener('click',marry);h.querySelector('#child')?.addEventListener('click',child);
 document.getElementById('assetsBody').innerHTML=['vehicle','home'].map(type=>{const a=assets[type],cur=S[type],n=a[cur+1];return `<div class="card row" style="margin-bottom:8px"><div class="ico">${a[cur][0]}</div><div class="info"><div class="name">${a[cur][1]}</div><div class="desc">درآمد غیرفعال: +${fmt(a[cur][3])}/سال</div></div>${n?`<button class="btn" data-buy="${type}" ${S.money<n[2]?'disabled':''}>${fmt(n[2])} 💰</button>`:'<span class="tag">MAX</span>'}</div>`}).join('');
 document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyAsset(b.dataset.buy))
}
function renderEvents(){
 const el=document.getElementById('eventBody');
 if(S.currentEvent){const e=S.currentEvent;el.innerHTML=`<div class="event"><div class="big">${e[2]}</div><h3>${e[3]}</h3><p>${e[4]}</p><div class="choices"><button class="btn choice" data-c="0">1️⃣ ${e[5]}</button><button class="btn choice" data-c="1">2️⃣ ${e[6]}</button></div></div>`;el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>resolveEvent(+b.dataset.c))}else el.innerHTML='<div class="lock">🎲 اتفاقات زندگی در طول سال‌ها ظاهر می‌شوند.<br>هر تصمیم می‌تواند مسیر آینده را تغییر دهد.</div>';
 document.getElementById('achBody').innerHTML=achievements.map(a=>`<div class="card row" style="margin-bottom:7px;opacity:${S.ach[a[0]]?1:.45}"><div class="ico">${a[1]}</div><div class="info"><div class="name">${a[2]}</div><div class="desc">${S.ach[a[0]]?'باز شده 🏆':'هنوز قفل است'}</div></div></div>`).join('')
}
function renderMore(){
 document.getElementById('prestige').textContent=fmt(S.prestige);
 document.getElementById('legacyBody').innerHTML=`<div class="card"><div class="name">✨ Prestige ${fmt(S.prestige)}</div><div class="desc">در ۷۵ سالگی می‌توانی زندگی جدیدی را شروع کنی. Prestige درآمد دائمی می‌دهد و دستاوردها حفظ می‌شوند.</div><button class="btn primary" id="prestigeBtn" style="width:100%;margin-top:9px" ${S.age<75?'disabled':''}>تولد دوباره</button></div>`;
 document.getElementById('prestigeBtn').onclick=prestige;
 const d=new Date();d.setHours(0,0,0,0);const claimed=S.lastDaily>=d.getTime();
 document.getElementById('dailyBody').innerHTML=`<div class="card row"><div class="ico">🎁</div><div class="info"><div class="name">${claimed?'جایزه دریافت شده':'جایزه روزانه آماده است'}</div><div class="desc">هر روز یک پاداش رایگان</div></div><button class="btn green" id="daily" ${claimed?'disabled':''}>${claimed?'✓':'دریافت'}</button></div>`;
 document.getElementById('daily').onclick=daily
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.classList.remove('show'),1900)}
function openView(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===id));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openView(b.dataset.v));
document.getElementById('endYear').onclick=finishYear;document.getElementById('rest').onclick=rest;
document.getElementById('reset').onclick=()=>{if(confirm('تمام پیشرفت پاک شود؟')){localStorage.removeItem(KEY);location.reload()}};
document.getElementById('share').onclick=()=>{const text=`🌱 زندگی من\\nسن: ${S.age}\\nدارایی: ${fmt(S.money)}\\nشغل: ${jobData()?.[2]||'ندارد'}\\nPrestige: ${S.prestige}`;try{tg?.switchInlineQuery?.(text,[])}catch(e){}if(navigator.share)navigator.share({title:'زندگی من',text}).catch(()=>{});else toast('📤 وضعیت بازی آماده اشتراک‌گذاری است')};
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');
load();render();
setInterval(()=>{if(S.passive){S.money+=S.passive;S.lifetime+=S.passive;render()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('beforeunload',save);
})();
</script>

<script>
window.LSX_UNI=[["دانشگاه محلی","عمومی",250,15,20],["دانشگاه فنی","فنی",700,25,35],["دانشکده پزشکی","پزشکی",1800,45,60],["مدرسه کسب‌وکار","مدیریت",1200,35,45],["آکادمی هنر","هنری",650,25,40],["آکادمی هوانوردی","هوانوردی",2400,50,55]];

/* ===== LIFE SIMULATOR X — GAMEPLAY EXPANSION ENGINE ===== */
(function(){
  const EXP = window.LSX_EXP = {
    version:"4.5",
    activeTab:"home",
    jobCategory:"همه",
    lifeLog:[],
    market:[],
    inventory:[],
    education:[],
    business:null,
    bank:{balance:0,debt:0,interest:0},
    relationshipName:"آشنای ناشناس",
    lastTick:Date.now(),
    prices:{},
    weather:"☀️",
    streak:0
  };

  const $=id=>document.getElementById(id);
  const money=n=>Math.floor(n||0).toLocaleString('fa-IR');
  const addLog=(icon,text)=>{
    EXP.lifeLog.unshift({age:S.age,icon,text,time:Date.now()});
    EXP.lifeLog=EXP.lifeLog.slice(0,40);
  };

  /* Offline progress: the player earns passive/business income while away. */
  function offlineProgress(){
    const now=Date.now(), sec=Math.max(0,Math.min(60*60*24*7,(now-(S.lastSeen||now))/1000));
    const perYear=(S.passive||0);
    if(sec>30 && perYear>0 && S.age>0){
      const earned=Math.floor(perYear*(sec/(365*24*3600)));
      if(earned>0){S.money+=earned;S.lifetime+=earned;addLog("💤","در زمان نبودنت +"+money(earned)+" درآمد غیرفعال گرفتی");setTimeout(()=>toast("💤 درآمد آفلاین: +"+money(earned)),300);}
    }
  }

  /* Better year-end accounting: property, business and reputation affect income. */
  function annualEconomy(){
    let passive=S.passive||0;
    passive += (S.home||0)*250;
    passive += (S.vehicle||0)*35;
    passive += (S.reputation||0)*4;
    if(EXP.business) passive += EXP.business.income;
    if(S.married) passive += 35;
    S.passive=passive;
    return passive;
  }

  /* Dynamic market prices make assets and investing less static. */
  function refreshMarket(){
    const names=["سهام فناوری","انرژی","حمل‌ونقل","سلامت","رسانه","مسکن"];
    EXP.market=names.map((name,i)=>{
      const old=EXP.prices[name]||1000+(i*400);
      const change=Math.round((Math.random()-.47)*old*.08);
      const value=Math.max(100,old+change);
      EXP.prices[name]=value;
      return {name,value,change};
    });
  }

  function invest(name,amount){
    if(amount<=0||S.money<amount)return toast("💰 موجودی کافی نیست");
    const price=EXP.prices[name]||1000;
    const shares=(EXP.inventory.find(x=>x.name===name)?.shares||0)+(amount/price);
    const existing=EXP.inventory.find(x=>x.name===name);
    if(existing)existing.shares=shares;else EXP.inventory.push({name,shares,cost:amount});
    S.money-=amount;toast("📈 سرمایه‌گذاری انجام شد: "+money(amount));
    addLog("📈","در "+name+" سرمایه‌گذاری کردی");
    renderAdvanced();
  }

  function sellInvest(name){
    const inv=EXP.inventory.find(x=>x.name===name);if(!inv)return;
    const price=EXP.prices[name]||1000, value=Math.floor(inv.shares*price);
    S.money+=value;S.lifetime+=Math.max(0,value-(inv.cost||0));EXP.inventory=EXP.inventory.filter(x=>x!==inv);
    toast("💵 سرمایه‌گذاری فروخته شد: "+money(value));renderAdvanced();
  }

  function buyItem(index){
    const item=window.LSX_ITEMS?.[index];if(!item)return;
    if(S.money<item[2])return toast("💰 پول کافی نیست");
    S.money-=item[2];EXP.inventory.push({name:item[0],item:true});
    S[item[3]]=Math.min(100,(S[item[3]]||0)+item[4]);
    toast(item[1]+" "+item[0]+" خریداری شد");
    addLog(item[1],"یک "+item[0]+" خریدی و "+item[4]+" واحد مهارت گرفتی");
    render();renderAdvanced();
  }

  function enroll(name,cost,skill,boost){
    if(S.age<16)return toast("🎓 هنوز زمان تحصیل تخصصی نرسیده");
    if(S.money<cost)return toast("💰 شهریه را نداری");
    S.money-=cost;S.education=Math.min(100,S.education+boost);
    if(skill&&S[skill]!=null)S[skill]=Math.min(100,S[skill]+boost);
    EXP.education.push({name,age:S.age});
    toast("🎓 در "+name+" ثبت‌نام کردی");
    addLog("🎓","تحصیل در "+name);
    renderAdvanced();
  }

  function createBusiness(name,icon,cost,income,level){
    if(S.age<22)return toast("🚀 برای راه‌اندازی شرکت باید حداقل ۲۲ ساله باشی");
    if(S.money<cost)return toast("💰 سرمایه کافی نیست");
    if(EXP.business)return toast("🏢 یک کسب‌وکار فعال داری");
    S.money-=cost;EXP.business={name,icon,cost,income,level,years:0,revenue:income};
    S.passive=(S.passive||0)+income;
    S.reputation=Math.min(100,S.reputation+8);
    toast("🚀 "+name+" راه‌اندازی شد");
    addLog(icon,"کسب‌وکار "+name+" را راه انداختی");
    renderAdvanced();
  }

  function upgradeBusiness(){
    if(!EXP.business)return;
    const b=EXP.business, cost=Math.floor(b.cost*(1+b.level*.35));
    if(S.money<cost)return toast("💰 سرمایه ارتقا کافی نیست");
    S.money-=cost;b.level++;b.income=Math.floor(b.income*1.28);b.revenue=b.income;S.passive+=Math.floor(b.income*.28);
    toast("📈 کسب‌وکارت ارتقا یافت");addLog("📈","سطح کسب‌وکارت به "+b.level+" رسید");renderAdvanced();
  }

  function bankDeposit(amount){
    amount=Math.floor(amount);if(amount<=0||S.money<amount)return toast("💰 مبلغ نامعتبر است");
    S.money-=amount;EXP.bank.balance+=amount;toast("🏦 "+money(amount)+" به بانک سپرده شد");renderAdvanced();
  }
  function bankWithdraw(amount){
    amount=Math.floor(amount);if(amount<=0||EXP.bank.balance<amount)return toast("🏦 موجودی بانک کافی نیست");
    EXP.bank.balance-=amount;S.money+=amount;toast("🏦 "+money(amount)+" برداشت شد");renderAdvanced();
  }
  function takeLoan(amount){
    amount=Math.floor(amount);if(amount<=0||EXP.bank.debt>0)return toast("🏦 ابتدا بدهی فعلی را مدیریت کن");
    EXP.bank.debt=amount;S.money+=amount;toast("🏦 وام "+money(amount)+" دریافت شد");addLog("🏦","وام "+money(amount)+" گرفتی");renderAdvanced();
  }
  function repayLoan(amount){
    amount=Math.floor(amount);if(EXP.bank.debt<=0)return toast("✅ بدهی نداری");
    amount=Math.min(amount,EXP.bank.debt,S.money);S.money-=amount;EXP.bank.debt-=amount;toast("🏦 "+money(amount)+" از بدهی پرداخت شد");renderAdvanced();
  }

  function renderAdvanced(){
    let p=$("advancedPanel");
    if(!p)return;
    annualEconomy();
    const inv=EXP.inventory.filter(x=>x.item), investments=EXP.inventory.filter(x=>!x.item);
    p.innerHTML=`
      <div class="section-title">📈 اقتصاد پیشرفته</div>
      <div class="kpi">
        <div class="card"><b>${money(EXP.bank.balance)}</b><small>سپرده بانکی</small></div>
        <div class="card"><b>${money(EXP.bank.debt)}</b><small>بدهی</small></div>
        <div class="card"><b>${money(S.passive)}</b><small>درآمد غیرفعال / سال</small></div>
        <div class="card"><b>${money(S.reputation)}</b><small>اعتبار</small></div>
      </div>
      <div class="section-title">🏦 بانک</div>
      <div class="actions">
        <button class="btn" id="dep1000">سپرده ۱۰۰۰</button>
        <button class="btn" id="wd1000">برداشت ۱۰۰۰</button>
        <button class="btn" id="loan5000">وام ۵۰۰۰</button>
        <button class="btn" id="repay5000">بازپرداخت ۵۰۰۰</button>
      </div>
      <div class="section-title">📊 بازار</div>
      <div class="grid">${EXP.market.map(m=>`<div class="card row"><div class="info"><div class="name">${m.name}</div><div class="desc">شاخص ${money(m.value)}</div></div><span class="badge ${m.change>=0?'good':'bad'}">${m.change>=0?'+':''}${money(m.change)}</span><button class="btn" data-invest="${m.name}">۱۰۰۰</button></div>`).join("")}</div>
      <div class="section-title">🎒 آیتم‌ها</div>
      <div class="grid two">${(window.LSX_ITEMS||[]).map((it,i)=>`<div class="card"><div class="name">${it[1]} ${it[0]}</div><div class="desc">${money(it[2])} • +${it[4]}</div><button class="btn green" data-item="${i}" style="width:100%;margin-top:6px">خرید</button></div>`).join("")}</div>
      ${EXP.business?`<div class="section-title">🏢 کسب‌وکار</div><div class="card row"><div class="ico">${EXP.business.icon}</div><div class="info"><div class="name">${EXP.business.name} • سطح ${EXP.business.level}</div><div class="desc">درآمد ${money(EXP.business.income)} / سال</div></div><button class="btn primary" id="bizUp">ارتقا</button></div>`:`<div class="section-title">🚀 کارآفرینی</div><div class="grid two">${(window.LSX_BUS||[]).slice(0,6).map((b,i)=>`<button class="btn" data-biz="${i}">${b[1]} ${b[0]}<br><span class="muted">${money(b[2])} سرمایه • ${money(b[3])}/سال</span></button>`).join("")}</div>`}
      <div class="section-title">📚 آموزش تخصصی</div>
      <div class="grid two">${(window.LSX_UNI||[]).map((u,i)=>`<button class="btn" data-edu="${i}">🎓 ${u[0]}<br><span class="muted">${money(u[2])} • +${u[4]}</span></button>`).join("")}</div>
      <div class="section-title">📝 تاریخچه</div>
      <div class="timeline">${EXP.lifeLog.slice(0,8).map(x=>`<div class="timeline-item"><b>${x.icon} ${x.text}</b><div class="micro">سن ${x.age}</div></div>`).join("")||'<div class="micro">هنوز اتفاقی ثبت نشده.</div>'}</div>
    `;
    $("dep1000").onclick=()=>bankDeposit(1000);$("wd1000").onclick=()=>bankWithdraw(1000);$("loan5000").onclick=()=>takeLoan(5000);$("repay5000").onclick=()=>repayLoan(5000);
    p.querySelectorAll("[data-invest]").forEach(b=>b.onclick=()=>invest(b.dataset.invest,1000));
    p.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>buyItem(+b.dataset.item));
    p.querySelectorAll("[data-biz]").forEach(b=>{const x=window.LSX_BUS[+b.dataset.biz];b.onclick=()=>createBusiness(x[0],x[1],x[2],x[3],x[4])});
    p.querySelectorAll("[data-edu]").forEach(b=>{const x=window.LSX_UNI[+b.dataset.edu];b.onclick=()=>enroll(x[0],x[2],x[1]==="فنی"?"intelligence":x[1]==="هنری"?"creativity":"education",x[4])});
    $("bizUp")?.addEventListener("click",upgradeBusiness);
  }

  function injectAdvancedPanels(){
    if(!$("more"))return;
    if(!$("advancedPanel")){
      const box=document.createElement("div");box.className="panel";box.id="advancedPanel";
      $("more").insertBefore(box,$("more").children[1]||null);
    }
    renderAdvanced();
  }

  const originalFinish=window.finishYear;
  /* Patch through the existing global functions when available. */
  window.addEventListener("load",()=>{
    try{
      offlineProgress();refreshMarket();injectAdvancedPanels();
      if(typeof render==="function"){
        const oldRender=render;
        window.render=function(){oldRender();renderAdvanced()};
      }
    }catch(e){console.warn("Expansion engine:",e)}
  });

  /* Expose a safe API for future Telegram/backend integrations. */
  window.LSX_API={
    getState:()=>JSON.parse(JSON.stringify(S)),
    getEconomy:()=>({bank:EXP.bank,business:EXP.business,market:EXP.market}),
    log:addLog,refreshMarket,invest,bankDeposit,bankWithdraw,takeLoan,repayLoan
  };
})();
