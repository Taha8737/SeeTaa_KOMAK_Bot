<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>زندگی من — نسخه‌ی دوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#12141c;
    --surface:#1b1e2a;
    --surface-2:#232739;
    --border:#2b3044;
    --accent:#e8a33d;
    --money:#4fbda0;
    --text:#edeae3;
    --text-muted:#8b8fa3;
    --danger:#e2596b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 50% -10%, #1e2233 0%, var(--bg) 55%) fixed,
      var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .app{
    max-width:430px;
    margin:0 auto;
    min-height:100dvh;
    padding:16px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  header{display:flex; align-items:baseline; justify-content:space-between;}
  header h1{font-size:18px; font-weight:800; margin:0; letter-spacing:-0.2px;}
  header span{font-size:11px; color:var(--text-muted);}

  .stats-row{display:flex; gap:10px;}
  .stat-chip{
    flex:1; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:8px;
  }
  .stat-chip .ic{font-size:18px;}
  .stat-chip .val{font-size:15px; font-weight:700; line-height:1.1;}
  .stat-chip .lbl{font-size:10px; color:var(--text-muted);}
  .stat-chip.money .val{color:var(--money);}

  .avatar-wrap{
    width:100%; height:210px; border-radius:18px; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 25%, #232a44, #12141c 75%);
    border:1px solid var(--border);
  }
  .avatar-wrap #avatarCanvas{width:100%; height:100%;}
  .avatar-wrap #avatarCanvas canvas{display:block; width:100% !important; height:100% !important;}
  .avatar-fallback{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:64px;}
  .avatar-caption{
    position:absolute; bottom:0; inset-inline:0; text-align:center; font-size:12px; font-weight:700;
    padding:8px 0; background:linear-gradient(0deg, rgba(0,0,0,.55), transparent);
  }

  .click-zone{display:flex; flex-direction:column; align-items:center; gap:14px; padding:4px 0; position:relative;}
  .work-btn{
    position:relative; width:170px; height:170px; border-radius:50%; border:none;
    background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .work-btn.empty{cursor:not-allowed;}
  .work-btn:focus-visible{outline:3px solid var(--accent); outline-offset:4px;}
  .work-btn .ring{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg);}
  .work-btn .ring-track{fill:none; stroke:var(--surface-2); stroke-width:8;}
  .work-btn .ring-fill{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .35s ease, stroke .2s ease;}
  .work-btn.empty .ring-fill{stroke:var(--danger);}
  .work-btn .core{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .1s ease; padding:0 14px; text-align:center;}
  .work-btn.pressed .core{transform:scale(.93);}
  .work-btn .core .ic{font-size:34px;}
  .work-btn .core .lbl{font-size:13px; font-weight:700;}
  .work-btn .core .val{font-size:11px; color:var(--text-muted);}

  .float-pop{
    position:absolute; top:14%; font-size:15px; font-weight:800; color:var(--money);
    pointer-events:none; animation:floatUp .8s ease forwards;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(0) translateX(-50%);}
    15%{opacity:1;}
    100%{opacity:0; transform:translateY(-46px) translateX(-50%);}
  }

  .next-year-btn{
    width:100%; padding:13px; border-radius:14px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); font-family:inherit;
    font-size:14px; font-weight:700; cursor:not-allowed; transition:.2s;
  }
  .next-year-btn.ready{
    background:linear-gradient(135deg, var(--accent), #f2c169); color:#241a06;
    border-color:transparent; cursor:pointer;
  }
  .next-year-btn:focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  section.upgrades{display:flex; flex-direction:column; gap:10px;}
  section.upgrades h2, .shop-section h3{font-size:13px; color:var(--text-muted); margin:2px 2px 0; font-weight:700;}
  .upgrade, .shop-card{
    display:flex; align-items:center; gap:12px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; padding:10px 12px;
  }
  .upgrade .ic, .shop-card .s-ic{
    font-size:22px; width:42px; height:42px; background:var(--surface-2);
    border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .upgrade .info, .shop-card .s-info{flex:1; min-width:0;}
  .upgrade .name, .shop-card .s-name{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .upgrade .lvl{font-size:10px; color:var(--accent); font-weight:700;}
  .upgrade .desc, .shop-card .s-desc{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .upgrade button, .shop-card button{
    flex-shrink:0; background:var(--surface-2); border:1px solid var(--border); color:var(--money);
    font-family:inherit; font-size:12px; font-weight:700; border-radius:10px; padding:9px 12px; cursor:pointer;
  }
  .upgrade button:disabled, .shop-card button:disabled{color:var(--text-muted); cursor:not-allowed; opacity:.5;}

  .tab-content{display:none; flex-direction:column; gap:12px;}
  .tab-content.active{display:flex;}

  .locked-note{
    background:var(--surface); border:1px dashed var(--border); border-radius:14px;
    padding:18px; text-align:center; color:var(--text-muted); font-size:12.5px; line-height:1.7;
  }

  .path-grid{display:flex; flex-direction:column; gap:10px;}
  .path-card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:12px; cursor:pointer;
  }
  .path-card .p-ic{width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .path-card .p-info{flex:1; min-width:0;}
  .path-card .p-name{font-size:13.5px; font-weight:700;}
  .path-card .p-desc{font-size:10.5px; color:var(--text-muted); margin-top:2px;}

  .job-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
    border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px;
  }
  .job-card .job-top{display:flex; align-items:center; gap:12px;}
  .job-card .job-ic{width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
  .job-card .job-title{font-size:15px; font-weight:800;}
  .job-card .job-sub{font-size:11px; color:var(--text-muted); margin-top:2px;}
  .xp-track{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
  .xp-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease;}
  .job-card .xp-label{font-size:10px; color:var(--text-muted); text-align:center;}
  .promote-btn{
    padding:11px; border-radius:12px; border:none; font-family:inherit; font-weight:700; font-size:13px;
    background:linear-gradient(135deg, var(--accent), #f2c169); color:#241a06; cursor:pointer;
  }
  .promote-btn:disabled{background:var(--surface-2); color:var(--text-muted); cursor:not-allowed;}

  .family-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;
    text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .family-card .f-ic{font-size:38px;}
  .marry-btn, .child-btn{
    padding:12px 20px; border-radius:12px; border:none; font-family:inherit; font-weight:700; font-size:13px;
    background:linear-gradient(135deg, var(--accent), #f2c169); color:#241a06; cursor:pointer;
  }
  .kids-list{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .kid-chip{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:8px 10px;
    font-size:11px; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:56px;
  }

  .prestige-card{
    background:linear-gradient(160deg, var(--surface), var(--surface-2)); border:1px solid var(--border);
    border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; text-align:center;
  }
  .prestige-points{font-size:30px; font-weight:800; color:var(--accent);}
  .rebirth-btn{
    padding:13px; border-radius:14px; border:none; font-family:inherit; font-weight:800; font-size:14px;
    background:linear-gradient(135deg,#c264d1,#e8a33d); color:#22091f; cursor:pointer;
  }
  .rebirth-btn:disabled{background:var(--surface-2); color:var(--text-muted); cursor:not-allowed;}

  .tabbar{
    position:sticky; bottom:0; display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:6px; gap:4px; margin-top:auto;
  }
  .tabbar button{
    flex:1; background:transparent; border:none; color:var(--text-muted); font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; border-radius:12px;
    font-size:9.5px; cursor:pointer;
  }
  .tabbar button .ic{font-size:18px;}
  .tabbar button.active{background:var(--surface-2); color:var(--accent);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌱 زندگی من</h1>
    <span>نسخه‌ی دوم</span>
  </header>

  <div class="stats-row">
    <div class="stat-chip money">
      <span class="ic">💰</span>
      <div><div class="val" id="moneyVal">۰</div><div class="lbl">پول</div></div>
    </div>
    <div class="stat-chip">
      <span class="ic">⚡</span>
      <div><div class="val" id="energyVal">۱۵۰/۱۵۰</div><div class="lbl">انرژی</div></div>
    </div>
  </div>

  <!-- HOME TAB -->
  <div class="tab-content active" id="tab-home">
    <div class="avatar-wrap" id="avatarWrap">
      <div id="avatarCanvas"></div>
      <div class="avatar-caption" id="avatarCaption">کودکی — سن: ۰ سال</div>
    </div>

    <div class="click-zone" id="clickZone">
      <button class="work-btn" id="workBtn">
        <svg class="ring" viewBox="0 0 170 170">
          <circle class="ring-track" cx="85" cy="85" r="75"></circle>
          <circle class="ring-fill" id="ringFill" cx="85" cy="85" r="75"></circle>
        </svg>
        <span class="core">
          <span class="ic">💪</span>
          <span class="lbl">کار کن</span>
          <span class="val" id="clickValueLabel">+۱ پول</span>
        </span>
      </button>
      <button class="next-year-btn" id="nextYearBtn">برو به سال بعد (۰ از ۸ کلیک)</button>
    </div>

    <section class="upgrades">
      <h2>ارتقاها</h2>
      <div class="upgrade" data-id="gloves">
        <div class="ic">🧤</div>
        <div class="info">
          <div class="name">دستکش کار <span class="lvl" id="lvl-gloves">سطح ۰</span></div>
          <div class="desc">قدرت هر کلیک را ۱ پول بیشتر می‌کند</div>
        </div>
        <button id="buy-gloves">۱۵</button>
      </div>
      <div class="upgrade" data-id="invest">
        <div class="ic">📈</div>
        <div class="info">
          <div class="name">سرمایه‌گذاری کوچک <span class="lvl" id="lvl-invest">سطح ۰</span></div>
          <div class="desc">هر ثانیه، بدون کلیک، پول می‌سازد</div>
        </div>
        <button id="buy-invest">۴۰</button>
      </div>
      <div class="upgrade" data-id="battery">
        <div class="ic">🔋</div>
        <div class="info">
          <div class="name">باتری انرژی <span class="lvl" id="lvl-battery">سطح ۰</span></div>
          <div class="desc">سقف انرژی را ۲۰ واحد بالا می‌برد</div>
        </div>
        <button id="buy-battery">۶۰</button>
      </div>
    </section>
  </div>

  <!-- CAREER TAB -->
  <div class="tab-content" id="tab-career"></div>

  <!-- SHOP TAB -->
  <div class="tab-content" id="tab-shop"></div>

  <!-- FAMILY TAB -->
  <div class="tab-content" id="tab-family"></div>

  <!-- PRESTIGE TAB -->
  <div class="tab-content" id="tab-prestige"></div>

  <nav class="tabbar">
    <button class="active" id="tabbtn-home" data-tab="home"><span class="ic">🏠</span><span>خانه</span></button>
    <button id="tabbtn-career" data-tab="career"><span class="ic">💼</span><span>شغل</span></button>
    <button id="tabbtn-shop" data-tab="shop"><span class="ic">🛍️</span><span>فروشگاه</span></button>
    <button id="tabbtn-family" data-tab="family"><span class="ic">👨‍👩‍👧</span><span>خانواده</span></button>
    <button id="tabbtn-prestige" data-tab="prestige"><span class="ic">✨</span><span>Prestige</span></button>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  try{
    if(window.Telegram && window.Telegram.WebApp){
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  }catch(e){}

  const fmt = n => Math.floor(n).toLocaleString('fa-IR');

  const CAREER_PATHS = {
    medical:  { name:'پزشکی',        icon:'🩺', color:'#4fbda0', jobs:['پرستار','پزشک عمومی','جراح متخصص'] },
    tech:     { name:'فناوری',       icon:'💻', color:'#5b8dee', jobs:['برنامه‌نویس تازه‌کار','مهندس نرم‌افزار','بنیان‌گذار استارتاپ'] },
    business: { name:'تجارت',        icon:'💼', color:'#e8a33d', jobs:['فروشنده','مدیر فروشگاه','مدیرعامل شرکت'] },
    arts:     { name:'هنر و سرگرمی', icon:'🎤', color:'#c264d1', jobs:['خواننده‌ی محلی','هنرمند شناخته‌شده','ستاره‌ی بین‌المللی'] },
    sports:   { name:'ورزش',         icon:'🏅', color:'#ef7b6a', jobs:['ورزشکار باشگاهی','قهرمان ملی','قهرمان جهانی'] }
  };
  const CAREER_LEVEL_BONUS = [{click:2,passive:3},{click:6,passive:8},{click:15,passive:20}];
  const CAREER_XP_THRESHOLD = [400, 1500];

  const SHOP_VEHICLE = [
    {name:'بدون وسیله نقلیه', icon:'🚶', bonus:0,  cost:0},
    {name:'موتور',            icon:'🛵', bonus:3,  cost:120},
    {name:'ماشین',            icon:'🚗', bonus:9,  cost:600},
    {name:'ماشین لوکس',       icon:'🏎️', bonus:22, cost:2200}
  ];
  const SHOP_PROPERTY = [
    {name:'اجاره‌نشین',      icon:'🏚️', bonus:0,  cost:0},
    {name:'آپارتمان کوچک',   icon:'🏠', bonus:4,  cost:200},
    {name:'آپارتمان بزرگ',   icon:'🏢', bonus:12, cost:900},
    {name:'ویلا',            icon:'🏰', bonus:28, cost:3000}
  ];
  const SPOUSE_NAMES = ['سارا','نیلوفر','آرش','پارسا','مریم','رضا','الناز','کیان'];

  const state = {
    money: 0,
    lifetimeEarned: 0,
    energy: 150,
    maxEnergy: 150,
    age: 0,
    yearClicks: 0,
    clicksNeeded: 8,
    clickValue: 1,
    passiveIncome: 0,
    upgrades: {
      gloves:  { level:0, baseCost:15, mult:1.65, effect:'click',     amount:1 },
      invest:  { level:0, baseCost:40, mult:1.70, effect:'passive',   amount:1 },
      battery: { level:0, baseCost:60, mult:1.80, effect:'maxEnergy', amount:20 }
    },
    career: { path:null, level:0, xp:0 },
    shop: { vehicle:0, property:0 },
    family: { married:false, spouseName:'', children:[] },
    totalPrestige: 0
  };

  function stageFor(age){
    if(age < 6)  return {label:'کودکی', icon:'👶'};
    if(age < 11) return {label:'دبستان', icon:'🎒'};
    if(age < 14) return {label:'راهنمایی', icon:'📘'};
    if(age < 18) return {label:'دبیرستان', icon:'📚'};
    if(age < 60) return {label:'بزرگسالی', icon:'🧑'};
    return {label:'سالمندی', icon:'👴'};
  }

  function upgradeCost(u){ return Math.round(u.baseCost * Math.pow(u.mult, u.level)); }
  function addMoney(amount){ state.money += amount; state.lifetimeEarned += amount; }

  const SAVE_KEY = 'seetaa_life_save_v1';

  function save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        money: state.money, lifetimeEarned: state.lifetimeEarned,
        energy: state.energy, maxEnergy: state.maxEnergy,
        age: state.age, yearClicks: state.yearClicks, clicksNeeded: state.clicksNeeded,
        clickValue: state.clickValue, passiveIncome: state.passiveIncome,
        upgrades: {
          gloves:{level:state.upgrades.gloves.level},
          invest:{level:state.upgrades.invest.level},
          battery:{level:state.upgrades.battery.level}
        },
        career: state.career, shop: state.shop, family: state.family,
        totalPrestige: state.totalPrestige
      }));
    }catch(e){}
  }

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      ['money','lifetimeEarned','energy','maxEnergy','age','yearClicks','clicksNeeded','clickValue','passiveIncome','totalPrestige']
        .forEach(function(k){ if(typeof d[k] === 'number') state[k] = d[k]; });
      if(d.upgrades){
        Object.keys(state.upgrades).forEach(function(id){
          if(d.upgrades[id] && typeof d.upgrades[id].level === 'number') state.upgrades[id].level = d.upgrades[id].level;
        });
      }
      if(d.career && typeof d.career === 'object'){
        state.career.path = d.career.path || null;
        state.career.level = typeof d.career.level === 'number' ? d.career.level : 0;
        state.career.xp = typeof d.career.xp === 'number' ? d.career.xp : 0;
      }
      if(d.shop && typeof d.shop === 'object'){
        state.shop.vehicle = typeof d.shop.vehicle === 'number' ? d.shop.vehicle : 0;
        state.shop.property = typeof d.shop.property === 'number' ? d.shop.property : 0;
      }
      if(d.family && typeof d.family === 'object'){
        state.family.married = !!d.family.married;
        state.family.spouseName = d.family.spouseName || '';
        state.family.children = Array.isArray(d.family.children) ? d.family.children : [];
      }
    }catch(e){}
  }

  // ---------- DOM refs ----------
  const moneyVal = document.getElementById('moneyVal');
  const energyVal = document.getElementById('energyVal');
  const avatarCaption = document.getElementById('avatarCaption');
  const workBtn = document.getElementById('workBtn');
  const ringFill = document.getElementById('ringFill');
  const clickValueLabel = document.getElementById('clickValueLabel');
  const nextYearBtn = document.getElementById('nextYearBtn');
  const clickZone = document.getElementById('clickZone');

  const ringLen = ringFill.getTotalLength ? ringFill.getTotalLength() : 2 * Math.PI * 75;
  ringFill.style.strokeDasharray = ringLen;

  // ---------- 3D avatar ----------
  let scene, camera, renderer, avatarGroup, headMesh, hairMesh, torsoMesh;
  let animFrame = null, currentScale = 1, targetScale = 1, avatarReady = false, homeTabActive = true;

  function initAvatar(){
    if(typeof THREE === 'undefined') return;
    try{
      const container = document.getElementById('avatarCanvas');
      const w = container.clientWidth, h = container.clientHeight;
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(35, w / h, 0.1, 100);
      camera.position.set(0, 1.15, 4.3);
      camera.lookAt(0, 0.9, 0);

      renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir = new THREE.DirectionalLight(0xffe3b0, 0.9);
      dir.position.set(2, 4, 3);
      scene.add(dir);

      avatarGroup = new THREE.Group();

      torsoMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.32, 0.9, 16),
        new THREE.MeshStandardMaterial({color:0x5b8dee, roughness:.5})
      );
      torsoMesh.position.y = 0.95;
      avatarGroup.add(torsoMesh);

      headMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 20, 20),
        new THREE.MeshStandardMaterial({color:0xe0b48c, roughness:.6})
      );
      headMesh.position.y = 1.68;
      avatarGroup.add(headMesh);

      hairMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 16, 16, 0, Math.PI * 2, 0, Math.PI / 1.7),
        new THREE.MeshStandardMaterial({color:0x2b2118, roughness:.7})
      );
      hairMesh.position.y = 1.78;
      avatarGroup.add(hairMesh);

      const armMat = new THREE.MeshStandardMaterial({color:0xe0b48c, roughness:.6});
      const armGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.75, 10);
      const armL = new THREE.Mesh(armGeo, armMat); armL.position.set(-0.48, 0.95, 0); armL.rotation.z = 0.12;
      const armR = new THREE.Mesh(armGeo, armMat); armR.position.set(0.48, 0.95, 0); armR.rotation.z = -0.12;
      avatarGroup.add(armL, armR);

      const legMat = new THREE.MeshStandardMaterial({color:0x232739, roughness:.6});
      const legGeo = new THREE.CylinderGeometry(0.13, 0.11, 0.85, 10);
      const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.17, 0.15, 0);
      const legR = new THREE.Mesh(legGeo, legMat); legR.position.set(0.17, 0.15, 0);
      avatarGroup.add(legL, legR);

      scene.add(avatarGroup);
      avatarReady = true;
      animateAvatar();

      window.addEventListener('resize', function(){
        const w2 = container.clientWidth, h2 = container.clientHeight;
        if(!w2 || !h2) return;
        camera.aspect = w2 / h2;
        camera.updateProjectionMatrix();
        renderer.setSize(w2, h2);
      });
    }catch(e){
      const c = document.getElementById('avatarCanvas');
      c.innerHTML = '<div class="avatar-fallback">🧑</div>';
    }
  }

  function updateAvatarForAge(age, careerPath){
    if(!avatarReady) return;
    let scale, hunch = 0;
    if(age < 6) scale = 0.42;
    else if(age < 11) scale = 0.58;
    else if(age < 14) scale = 0.72;
    else if(age < 18) scale = 0.86;
    else if(age < 60) scale = 1.0;
    else { scale = 0.94; hunch = 0.15; }

    targetScale = scale;
    hairMesh.material.color.set(age >= 60 ? 0xcfd2da : 0x2b2118);
    avatarGroup.rotation.x = hunch;

    const careerColors = {medical:0xffffff, tech:0x5b8dee, business:0x2b3044, arts:0xc264d1, sports:0xef7b6a};
    torsoMesh.material.color.set(careerPath && careerColors[careerPath] !== undefined ? careerColors[careerPath] : 0x5b8dee);
  }

  function animateAvatar(){
    if(!homeTabActive || !avatarReady){ animFrame = null; return; }
    currentScale += (targetScale - currentScale) * 0.08;
    avatarGroup.scale.set(currentScale, currentScale, currentScale);
    avatarGroup.rotation.y += 0.008;
    renderer.render(scene, camera);
    animFrame = requestAnimationFrame(animateAvatar);
  }

  // ---------- work button label ----------
  function updateWorkButtonLabel(){
    const lblEl = workBtn.querySelector('.lbl');
    const icEl = workBtn.querySelector('.ic');
    if(state.career.path){
      const p = CAREER_PATHS[state.career.path];
      lblEl.textContent = p.jobs[state.career.level];
      icEl.textContent = p.icon;
    }else{
      lblEl.textContent = 'کار کن';
      icEl.textContent = '💪';
    }
  }

  // ---------- career ----------
  function selectCareer(pathId){
    if(state.age < 18 || state.career.path) return;
    state.career.path = pathId;
    state.career.level = 0;
    state.career.xp = 0;
    const bonus = CAREER_LEVEL_BONUS[0];
    state.clickValue += bonus.click;
    state.passiveIncome += bonus.passive;
    render();
  }

  function promoteCareer(){
    const c = state.career;
    if(!c.path || c.level >= 2) return;
    const need = CAREER_XP_THRESHOLD[c.level];
    if(c.xp < need) return;
    const bonus = CAREER_LEVEL_BONUS[c.level + 1];
    state.clickValue += bonus.click;
    state.passiveIncome += bonus.passive;
    c.level += 1;
    render();
  }

  function renderCareerTab(){
    const el = document.getElementById('tab-career');
    if(state.age < 18){
      el.innerHTML = '<div class="locked-note">مسیر شغلی از سن ۱۸ سالگی باز می‌شه.<br>سن فعلی: ' + fmt(state.age) + ' سال</div>';
      return;
    }
    const c = state.career;
    if(!c.path){
      let html = '<div class="path-grid">';
      Object.keys(CAREER_PATHS).forEach(function(id){
        const p = CAREER_PATHS[id];
        html += '<div class="path-card" data-path="' + id + '">' +
          '<div class="p-ic" style="background:' + p.color + '22;color:' + p.color + '">' + p.icon + '</div>' +
          '<div class="p-info"><div class="p-name">' + p.name + '</div>' +
          '<div class="p-desc">' + p.jobs.join(' ← ') + '</div></div></div>';
      });
      html += '</div>';
      el.innerHTML = html;
      el.querySelectorAll('.path-card').forEach(function(card){
        card.addEventListener('click', function(){ selectCareer(card.dataset.path); });
      });
    }else{
      const p = CAREER_PATHS[c.path];
      const maxed = c.level >= 2;
      const need = maxed ? 0 : CAREER_XP_THRESHOLD[c.level];
      const ratio = maxed ? 1 : Math.min(1, c.xp / need);
      el.innerHTML =
        '<div class="job-card">' +
          '<div class="job-top">' +
            '<div class="job-ic" style="background:' + p.color + '22;color:' + p.color + '">' + p.icon + '</div>' +
            '<div><div class="job-title">' + p.jobs[c.level] + '</div>' +
            '<div class="job-sub">' + p.name + ' — سطح ' + fmt(c.level + 1) + ' از ۳</div></div>' +
          '</div>' +
          (maxed
            ? '<div class="xp-label">به بالاترین سطح این مسیر رسیدی 🎉</div>'
            : '<div class="xp-track"><div class="xp-fill" style="width:' + (ratio * 100) + '%"></div></div>' +
              '<div class="xp-label">' + fmt(c.xp) + ' از ' + fmt(need) + ' تجربه</div>' +
              '<button class="promote-btn" id="promoteBtn" ' + (ratio >= 1 ? '' : 'disabled') + '>ارتقا به ' + p.jobs[c.level + 1] + '</button>'
          ) +
        '</div>';
      const btn = document.getElementById('promoteBtn');
      if(btn) btn.addEventListener('click', promoteCareer);
    }
  }

  // ---------- shop ----------
  function buyShopTier(key){
    const arr = key === 'vehicle' ? SHOP_VEHICLE : SHOP_PROPERTY;
    const cur = state.shop[key];
    if(cur >= arr.length - 1) return;
    const next = arr[cur + 1];
    if(state.money < next.cost) return;
    state.money -= next.cost;
    state.passiveIncome += (next.bonus - arr[cur].bonus);
    state.shop[key] += 1;
    render();
  }

  function renderShopTab(){
    const el = document.getElementById('tab-shop');
    function section(title, arr, key){
      const cur = state.shop[key];
      let html = '<div class="shop-section"><h3>' + title + '</h3>';
      if(cur < arr.length - 1){
        const next = arr[cur + 1];
        const affordable = state.money >= next.cost;
        html += '<div class="shop-card">' +
          '<div class="s-ic">' + next.icon + '</div>' +
          '<div class="s-info"><div class="s-name">' + next.name + '</div>' +
          '<div class="s-desc">درآمد غیرفعال +' + fmt(next.bonus - arr[cur].bonus) + '/ثانیه</div></div>' +
          '<button data-key="' + key + '" ' + (affordable ? '' : 'disabled') + '>' + fmt(next.cost) + '</button>' +
          '</div>';
      }else{
        html += '<div class="shop-card"><div class="s-ic">' + arr[cur].icon + '</div>' +
          '<div class="s-info"><div class="s-name">' + arr[cur].name + '</div>' +
          '<div class="s-desc">بالاترین سطح این دسته</div></div></div>';
      }
      return html + '</div>';
    }
    el.innerHTML = section('وسیله نقلیه', SHOP_VEHICLE, 'vehicle') + section('ملک', SHOP_PROPERTY, 'property');
    el.querySelectorAll('button[data-key]').forEach(function(btn){
      btn.addEventListener('click', function(){ buyShopTier(btn.dataset.key); });
    });
  }

  // ---------- family ----------
  function doMarry(){
    if(state.family.married || state.age < 18) return;
    state.family.married = true;
    state.family.spouseName = SPOUSE_NAMES[Math.floor(Math.random() * SPOUSE_NAMES.length)];
    state.passiveIncome += 5;
    render();
  }
  function doHaveChild(){
    if(!state.family.married || state.family.children.length >= 3) return;
    state.family.children.push({age:0});
    render();
  }
  function renderFamilyTab(){
    const el = document.getElementById('tab-family');
    if(state.age < 18){
      el.innerHTML = '<div class="locked-note">ازدواج از سن ۱۸ سالگی امکان‌پذیره</div>';
      return;
    }
    const f = state.family;
    let html = '';
    if(!f.married){
      html += '<div class="family-card"><div class="f-ic">💍</div><div>هنوز مجرّدی</div>' +
        '<button class="marry-btn" id="marryBtn">ازدواج کن</button></div>';
    }else{
      html += '<div class="family-card"><div class="f-ic">👫</div>' +
        '<div>ازدواج کردی با <b>' + f.spouseName + '</b></div>' +
        '<div style="font-size:11px;color:var(--text-muted)">درآمد غیرفعال +۵/ثانیه از همسرت</div>';
      if(f.children.length < 3) html += '<button class="child-btn" id="childBtn">بچه‌دار شو</button>';
      html += '</div>';
      if(f.children.length){
        html += '<div class="kids-list">';
        f.children.forEach(function(kid, i){
          const stg = stageFor(kid.age);
          html += '<div class="kid-chip"><span style="font-size:20px">' + stg.icon + '</span>' +
            '<span>فرزند ' + fmt(i + 1) + '</span><span>' + fmt(kid.age) + ' ساله</span></div>';
        });
        html += '</div>';
      }
    }
    el.innerHTML = html;
    const marryBtn = document.getElementById('marryBtn');
    if(marryBtn) marryBtn.addEventListener('click', doMarry);
    const childBtn = document.getElementById('childBtn');
    if(childBtn) childBtn.addEventListener('click', doHaveChild);
  }

  // ---------- prestige ----------
  function prestigeEarnable(){ return Math.max(0, Math.min(10, Math.floor(state.lifetimeEarned / 1000))); }

  function doRebirth(){
    if(state.age < 65) return;
    if(!window.confirm('مطمئنی؟ همه‌چیز به‌جز پوینت‌های Prestige از اول شروع می‌شه.')) return;
    const earned = prestigeEarnable();
    const newTotal = state.totalPrestige + earned;
    Object.assign(state, {
      money: newTotal * 100,
      lifetimeEarned: 0,
      energy: 150, maxEnergy: 150,
      age: 0, yearClicks: 0, clicksNeeded: 8,
      clickValue: 1, passiveIncome: 0,
      career: {path:null, level:0, xp:0},
      shop: {vehicle:0, property:0},
      family: {married:false, spouseName:'', children:[]},
      totalPrestige: newTotal
    });
    state.upgrades.gloves.level = 0;
    state.upgrades.invest.level = 0;
    state.upgrades.battery.level = 0;
    render();
  }

  function renderPrestigeTab(){
    const el = document.getElementById('tab-prestige');
    const ready = state.age >= 65;
    const earnable = prestigeEarnable();
    el.innerHTML =
      '<div class="prestige-card">' +
        '<div>پوینت‌های Prestige شما</div>' +
        '<div class="prestige-points">' + fmt(state.totalPrestige) + '</div>' +
        '<div style="font-size:11px;color:var(--text-muted)">معادل ' + fmt(state.totalPrestige * 100) + ' دلار پاداش شروع در زندگی بعدی</div>' +
        '<hr style="border-color:var(--border);width:100%;opacity:.5;">' +
        '<div style="font-size:12.5px;line-height:1.7;">' + (ready
          ? 'این زندگی آماده‌ی تولد دوباره‌ست. با این کار <b>' + fmt(earnable) + '</b> پوینت جدید می‌گیری (حداکثر ۱۰ در هر زندگی) و همه‌چیز به‌جز پوینت‌ها از صفر شروع می‌شه.'
          : 'تولد دوباره از سن ۶۵ سالگی باز می‌شه.<br>سن فعلی: ' + fmt(state.age)) +
        '</div>' +
        '<button class="rebirth-btn" id="rebirthBtn" ' + (ready ? '' : 'disabled') + '>شروع زندگی جدید (+' + fmt(earnable) + ' پوینت)</button>' +
      '</div>';
    const btn = document.getElementById('rebirthBtn');
    if(btn) btn.addEventListener('click', doRebirth);
  }

  // ---------- main render ----------
  function render(){
    moneyVal.textContent = fmt(state.money);
    energyVal.textContent = fmt(state.energy) + '/' + fmt(state.maxEnergy);

    const stg = stageFor(state.age);
    avatarCaption.textContent = stg.label + ' — سن: ' + fmt(state.age) + ' سال';
    updateAvatarForAge(state.age, state.career.path);

    clickValueLabel.textContent = '+' + fmt(state.clickValue) + ' پول';
    updateWorkButtonLabel();

    const ratio = Math.max(0, Math.min(1, state.energy / state.maxEnergy));
    ringFill.style.strokeDashoffset = ringLen * (1 - ratio);
    workBtn.classList.toggle('empty', state.energy <= 0);

    const yready = state.yearClicks >= state.clicksNeeded;
    nextYearBtn.classList.toggle('ready', yready);
    nextYearBtn.textContent = yready
      ? 'برو به سال بعد ✓'
      : 'برو به سال بعد (' + fmt(state.yearClicks) + ' از ' + fmt(state.clicksNeeded) + ' کلیک)';

    Object.keys(state.upgrades).forEach(function(id){
      const u = state.upgrades[id];
      const cost = upgradeCost(u);
      document.getElementById('lvl-' + id).textContent = 'سطح ' + fmt(u.level);
      const btn = document.getElementById('buy-' + id);
      btn.textContent = fmt(cost);
      btn.disabled = state.money < cost;
    });

    renderCareerTab();
    renderShopTab();
    renderFamilyTab();
    renderPrestigeTab();

    save();
  }

  function popFloat(text){
    const el = document.createElement('span');
    el.className = 'float-pop';
    el.textContent = text;
    el.style.left = (46 + Math.random() * 20 - 10) + '%';
    clickZone.appendChild(el);
    el.addEventListener('animationend', function(){ el.remove(); });
  }

  function doWork(){
    if(state.energy <= 0){ workBtn.classList.add('empty'); return; }
    state.energy -= 1;
    addMoney(state.clickValue);
    state.yearClicks += 1;
    if(state.career.path) state.career.xp += state.clickValue;
    popFloat('+' + fmt(state.clickValue));
    render();
  }

  workBtn.addEventListener('click', doWork);
  workBtn.addEventListener('pointerdown', function(){ workBtn.classList.add('pressed'); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(evt){
    workBtn.addEventListener(evt, function(){ workBtn.classList.remove('pressed'); });
  });

  nextYearBtn.addEventListener('click', function(){
    if(state.yearClicks < state.clicksNeeded) return;
    state.age += 1;
    state.yearClicks = 0;
    state.clicksNeeded = 8 + Math.floor(state.age / 5) * 2;
    state.family.children.forEach(function(k){ k.age += 1; });
    render();
  });

  Object.keys(state.upgrades).forEach(function(id){
    document.getElementById('buy-' + id).addEventListener('click', function(){
      const u = state.upgrades[id];
      const cost = upgradeCost(u);
      if(state.money < cost) return;
      state.money -= cost;
      u.level += 1;
      if(u.effect === 'click') state.clickValue += u.amount;
      if(u.effect === 'passive') state.passiveIncome += u.amount;
      if(u.effect === 'maxEnergy'){ state.maxEnergy += u.amount; state.energy += u.amount; }
      render();
    });
  });

  setInterval(function(){
    if(state.passiveIncome > 0){ addMoney(state.passiveIncome); render(); }
  }, 1000);

  setInterval(function(){
    if(state.energy < state.maxEnergy){
      state.energy = Math.min(state.maxEnergy, state.energy + 1);
      render();
    }
  }, 3000);

  // ---------- tabs ----------
  const TABS = ['home','career','shop','family','prestige'];
  function setActiveTab(tab){
    TABS.forEach(function(t){
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      document.getElementById('tabbtn-' + t).classList.toggle('active', t === tab);
    });
    homeTabActive = (tab === 'home');
    if(homeTabActive && !animFrame && avatarReady) animateAvatar();
  }
  document.querySelectorAll('.tabbar button').forEach(function(btn){
    btn.addEventListener('click', function(){ setActiveTab(btn.dataset.tab); });
  });

  load();
  initAvatar();
  render();
})();
</script>
</body>
</html>
